<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard walkthrough: database indexes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#D9DFDB; --panel:#FFFFFF; --text:#1E2126; --muted:#5E6570; --line:#C7CEC9;
  --board:#FCFCFA; --tray:#A9AEB3;
  --k:#23262C; --r:#CF3530; --g:#1E8649; --b:#2360AE;
  --hand:"Kalam", "Comic Sans MS", cursive;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --wall:#1C1F22; --panel:#262A2E; --text:#ECEEF0; --muted:#A5ACB4; --line:#3A3F44; --tray:#5A6066; }
}
:root[data-theme="dark"]{ --wall:#1C1F22; --panel:#262A2E; --text:#ECEEF0; --muted:#A5ACB4; --line:#3A3F44; --tray:#5A6066; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--text);font-family:var(--body)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:18px}

/* Board */
.board-wrap{display:flex;flex-direction:column;min-height:0}
.board{
  flex:1;min-height:0;background:var(--board);border:10px solid #E4E7EA;border-radius:6px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;overflow:auto;
}
.tray{height:12px;margin:0 4%;background:var(--tray);border-radius:0 0 6px 6px;position:relative}
.tray::before,.tray::after{content:"";position:absolute;top:-4px;width:46px;height:9px;border-radius:4px}
.tray::before{left:18%;background:var(--r)} .tray::after{left:24%;background:var(--g)}
svg.wb{width:100%;height:100%;max-height:100%;min-width:760px;display:block}
svg.wb text{font-family:var(--hand)}
.k{stroke:var(--k);fill:none}.r{stroke:var(--r);fill:none}.g{stroke:var(--g);fill:none}.b{stroke:var(--b);fill:none}
text.k{fill:var(--k);stroke:none}text.r{fill:var(--r);stroke:none}text.g{fill:var(--g);stroke:none}text.b{fill:var(--b);stroke:none}
.sw2{stroke-width:2.5}.sw3{stroke-width:3.5}.dash{stroke-dasharray:7 7}
svg.wb *{stroke-linecap:round;stroke-linejoin:round}
g[data-step]{display:none}
g[data-step].on{display:inline}
.anim.ink{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-in-out forwards;animation-delay:var(--d)}
.anim.ink.dash{stroke-dasharray:1}
text.anim{opacity:0;animation:write .45s ease forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes write{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
g.now text, g.now .ink{filter:drop-shadow(0 0 .5px currentColor)}

/* Panel */
.panel{background:var(--panel);border-radius:8px;display:flex;flex-direction:column;min-height:0;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.panel header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.panel header p{margin:0;color:var(--muted);font-size:14px}
.panel header h1{margin:2px 0 0;font:700 21px/1.25 var(--body)}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--g);transition:width .3s}
.script{flex:1;overflow-y:auto;padding:16px 20px}
.draw{background:rgba(35,96,174,.09);border-left:4px solid var(--b);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:16px;font-size:15px;line-height:1.45}
.draw b{color:var(--b)}
.line{display:flex;gap:10px;margin-bottom:12px;line-height:1.5;font-size:16px}
.who{flex:0 0 auto;font-weight:700;font-size:12px;padding:3px 8px;border-radius:10px;height:fit-content;margin-top:2px}
.who.you{background:var(--g);color:#fff}
.who.class{background:var(--line);color:var(--text)}
.line.class .said{color:var(--muted);font-style:italic}
.controls{display:flex;gap:8px;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.controls button{font:700 15px var(--body);border:0;border-radius:6px;padding:11px 16px;cursor:pointer}
#prev{background:var(--line);color:var(--text)}
#next{background:var(--g);color:#fff;flex:1}
#replay{background:transparent;color:var(--muted);padding:11px 8px}
.controls button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}

@media (max-width:980px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto;padding:10px}
  .board{height:62vh;justify-content:flex-start}
  .panel{min-height:0}
  .script{max-height:none}
  .controls{position:sticky;bottom:0;background:var(--panel);border-radius:0 0 8px 8px}
}
@media (prefers-reduced-motion:reduce){
  .anim.ink{animation:none;stroke-dashoffset:0}
  text.anim{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap">
    <div class="board">
<svg class="wb" id="wb" viewBox="0 0 1200 720" role="img" aria-label="Whiteboard drawing of how a database index works">

  <!-- 1 question + query -->
  <g data-step="1">
    <text class="k" x="40" y="52" font-size="32" font-weight="700">How does the DB find Sam?</text>
    <line class="k sw2" x1="40" y1="62" x2="400" y2="60"/>
    <text class="b" x="40" y="92" font-size="18">SELECT * FROM customers WHERE email = 'sam@...'</text>
  </g>

  <!-- 2 table -->
  <g data-step="2">
    <rect class="k sw2" x="40" y="120" width="230" height="350" rx="3"/>
    <text class="k" x="155" y="146" font-size="19" font-weight="700" text-anchor="middle">customers</text>
    <line class="k sw2" x1="40" y1="158" x2="270" y2="158"/>
    <line class="k" x1="40" y1="190" x2="270" y2="190"/>
    <line class="k" x1="40" y1="222" x2="270" y2="222"/>
    <line class="k" x1="40" y1="254" x2="270" y2="254"/>
    <line class="k" x1="40" y1="286" x2="270" y2="286"/>
    <line class="k" x1="40" y1="318" x2="270" y2="318"/>
    <line class="k" x1="40" y1="350" x2="270" y2="350"/>
    <line class="k" x1="40" y1="382" x2="270" y2="382"/>
    <line class="k" x1="40" y1="414" x2="270" y2="414"/>
    <text class="k" x="56" y="181" font-size="17">zoe@...</text>
    <text class="k" x="56" y="213" font-size="17">ali@...</text>
    <text class="k" x="56" y="245" font-size="17">raj@...</text>
    <text class="k" x="56" y="277" font-size="17">bea@...</text>
    <text class="k" x="56" y="309" font-size="17">kai@...</text>
    <text class="k" x="56" y="341" font-size="17">dev@...</text>
    <text class="k" x="56" y="373" font-size="17">sam@...</text>
    <text class="k" x="56" y="405" font-size="17">lee@...</text>
    <text class="k" x="56" y="446" font-size="20">⋮</text>
    <text class="k" x="155" y="494" font-size="16" text-anchor="middle">1,000,000 rows (not sorted)</text>
  </g>

  <!-- 3 full scan -->
  <g data-step="3">
    <line class="r sw3" x1="292" y1="165" x2="292" y2="458"/>
    <polyline class="r sw3" points="281,444 292,460 303,444"/>
    <text class="r" x="40" y="530" font-size="24" font-weight="700">full table scan</text>
    <text class="r" x="40" y="560" font-size="21">= up to 1,000,000 checks</text>
  </g>

  <!-- 4 textbook -->
  <g data-step="4">
    <rect class="k sw2" x="40" y="590" width="120" height="115" rx="3"/>
    <text class="k" x="100" y="614" font-size="17" font-weight="700" text-anchor="middle">Index</text>
    <text class="k" x="50" y="640" font-size="14">Subnets ..... 188</text>
    <text class="g" x="50" y="662" font-size="14" font-weight="700">TCP ......... 212</text>
    <text class="k" x="50" y="684" font-size="14">UDP ......... 230</text>
    <path class="g sw2" d="M165 656 C 185 646, 195 646, 212 652"/>
    <polyline class="g sw2" points="203,644 213,652 202,659"/>
    <rect class="k sw2" x="218" y="600" width="80" height="100" rx="3"/>
    <text class="k" x="258" y="688" font-size="15" text-anchor="middle">p. 212</text>
    <line class="k" x1="228" y1="620" x2="288" y2="620"/>
    <line class="k" x1="228" y1="634" x2="280" y2="634"/>
    <line class="g sw2" x1="228" y1="648" x2="288" y2="648"/>
  </g>

  <!-- 5 root -->
  <g data-step="5">
    <text class="b" x="330" y="152" font-size="20" font-weight="700">B-tree</text>
    <rect class="b sw2" x="565" y="130" width="70" height="40" rx="6"/>
    <text class="b" x="600" y="158" font-size="22" font-weight="700" text-anchor="middle">50</text>
  </g>

  <!-- 6 middle -->
  <g data-step="6">
    <line class="b sw2" x1="582" y1="170" x2="455" y2="230"/>
    <line class="b sw2" x1="618" y1="170" x2="745" y2="230"/>
    <rect class="b sw2" x="400" y="230" width="100" height="40" rx="6"/>
    <text class="b" x="450" y="258" font-size="20" font-weight="700" text-anchor="middle">20 | 35</text>
    <rect class="b sw2" x="700" y="230" width="100" height="40" rx="6"/>
    <text class="b" x="750" y="258" font-size="20" font-weight="700" text-anchor="middle">70 | 85</text>
    <text class="b" x="455" y="215" font-size="15" text-anchor="end">smaller</text>
    <text class="b" x="815" y="215" font-size="15">bigger</text>
  </g>

  <!-- 7 leaves -->
  <g data-step="7">
    <line class="b" x1="410" y1="270" x2="372" y2="350"/>
    <line class="b" x1="450" y1="270" x2="460" y2="350"/>
    <line class="b" x1="490" y1="270" x2="548" y2="350"/>
    <line class="b" x1="710" y1="270" x2="652" y2="350"/>
    <line class="b" x1="750" y1="270" x2="740" y2="350"/>
    <line class="b" x1="790" y1="270" x2="828" y2="350"/>
    <rect class="b sw2" x="332" y="350" width="80" height="38" rx="5"/>
    <rect class="b sw2" x="420" y="350" width="80" height="38" rx="5"/>
    <rect class="b sw2" x="508" y="350" width="80" height="38" rx="5"/>
    <rect class="b sw2" x="612" y="350" width="80" height="38" rx="5"/>
    <rect class="b sw2" x="700" y="350" width="80" height="38" rx="5"/>
    <rect class="b sw2" x="788" y="350" width="80" height="38" rx="5"/>
    <text class="b" x="372" y="376" font-size="17" text-anchor="middle">5, 12</text>
    <text class="b" x="460" y="376" font-size="17" text-anchor="middle">22, 28</text>
    <text class="b" x="548" y="376" font-size="17" text-anchor="middle">38, 42</text>
    <text class="b" x="652" y="376" font-size="17" text-anchor="middle">55, 60</text>
    <text class="b" x="740" y="376" font-size="17" text-anchor="middle">72, 78</text>
    <text class="b" x="828" y="376" font-size="17" text-anchor="middle">88, 93</text>
    <text class="b" x="332" y="412" font-size="15">leaves: all values, sorted</text>
  </g>

  <!-- 8 trace root -->
  <g data-step="8">
    <text class="g" x="690" y="102" font-size="22" font-weight="700">find 78</text>
    <ellipse class="g sw3" cx="600" cy="150" rx="56" ry="33"/>
    <text class="g" x="660" y="130" font-size="18">78 &gt; 50, go right</text>
    <line class="g sw3" x1="620" y1="172" x2="742" y2="228"/>
  </g>

  <!-- 9 trace middle -->
  <g data-step="9">
    <ellipse class="g sw3" cx="750" cy="250" rx="72" ry="32"/>
    <text class="g" x="688" y="206" font-size="17" text-anchor="end">70 &lt; 78 &lt; 85</text>
    <text class="g" x="688" y="226" font-size="17" text-anchor="end">take the middle</text>
    <line class="g sw3" x1="750" y1="272" x2="740" y2="348"/>
  </g>

  <!-- 10 found -->
  <g data-step="10">
    <ellipse class="g sw3" cx="740" cy="369" rx="54" ry="30"/>
    <text class="g" x="722" y="424" font-size="22" font-weight="700">found it! 3 steps</text>
  </g>

  <!-- 11 pointer -->
  <g data-step="11">
    <path class="g sw2 dash" d="M700 385 C 620 470, 420 470, 276 368"/>
    <polyline class="g sw2" points="282,383 272,366 291,364"/>
    <text class="g" x="480" y="470" font-size="17">pointer to the real row</text>
    <rect class="g sw3" x="44" y="352" width="222" height="28" rx="4"/>
  </g>

  <!-- 12 scaling -->
  <g data-step="12">
    <text class="k" x="380" y="528" font-size="19" font-weight="700">rows</text>
    <text class="r" x="570" y="528" font-size="19" font-weight="700">scan</text>
    <text class="g" x="720" y="528" font-size="19" font-weight="700">index</text>
    <line class="k sw2" x1="375" y1="540" x2="820" y2="540"/>
    <text class="k" x="380" y="570" font-size="19">1,000</text>
    <text class="r" x="570" y="570" font-size="19">1,000</text>
    <text class="g" x="720" y="570" font-size="19">~10</text>
    <text class="k" x="380" y="602" font-size="19">1,000,000</text>
    <text class="r" x="570" y="602" font-size="19">1,000,000</text>
    <text class="g" x="720" y="602" font-size="19">~20</text>
    <text class="k" x="380" y="634" font-size="19">1 billion</text>
    <text class="r" x="570" y="634" font-size="19">1 billion</text>
    <text class="g" x="720" y="634" font-size="19">~30</text>
    <text class="k" x="380" y="672" font-size="20">O(n)  vs  O(log n)</text>
  </g>

  <!-- 13 seesaw -->
  <g data-step="13">
    <text class="k" x="900" y="120" font-size="22" font-weight="700">The catch</text>
    <polygon class="k sw2" points="1030,242 1002,290 1058,290"/>
    <line class="k sw3" x1="905" y1="272" x2="1165" y2="212"/>
    <text class="g" x="1165" y="192" font-size="18" text-anchor="end">reads faster</text>
    <text class="r" x="900" y="300" font-size="18">writes slower</text>
    <text class="r" x="900" y="322" font-size="18">+ more disk</text>
  </g>

  <!-- 14 rules -->
  <g data-step="14">
    <line class="k" x1="890" y1="345" x2="1180" y2="345"/>
    <text class="g" x="900" y="375" font-size="20" font-weight="700">Index it</text>
    <text class="g" x="900" y="400" font-size="17">✓ cols in WHERE, JOIN, ORDER BY</text>
    <text class="g" x="900" y="423" font-size="17">✓ big tables</text>
    <text class="r" x="900" y="458" font-size="20" font-weight="700">Skip it</text>
    <text class="r" x="900" y="483" font-size="17">✗ tiny tables</text>
    <text class="r" x="900" y="506" font-size="17">✗ true/false columns</text>
  </g>

  <!-- 15 composite -->
  <g data-step="15">
    <line class="k" x1="890" y1="528" x2="1180" y2="528"/>
    <text class="b" x="900" y="556" font-size="18" font-weight="700">INDEX (last, first)</text>
    <text class="k" x="900" y="584" font-size="17">Patel, Ravi</text>
    <text class="k" x="900" y="608" font-size="17">Singh, Aman</text>
    <text class="k" x="900" y="632" font-size="17">Singh, Priya</text>
    <text class="k" x="900" y="656" font-size="17">Wong, Priya</text>
    <text class="k" x="900" y="680" font-size="17">Wong, Lily</text>
    <path class="g sw2" d="M1010 594 Q 1022 594, 1022 606 L 1022 616 Q 1022 626, 1010 628"/>
    <text class="g" x="1030" y="616" font-size="16">Singh? together ✓</text>
    <text class="r" x="1030" y="646" font-size="16">Priya? scattered ✗</text>
    <line class="r" x1="1003" y1="636" x2="1003" y2="660"/>
  </g>

  <!-- 16 wrap -->
  <g data-step="16">
    <rect class="g sw2" x="355" y="688" width="470" height="28" rx="6"/>
    <text class="g" x="590" y="708" font-size="17" text-anchor="middle">tip: put EXPLAIN before a query to check</text>
  </g>
</svg>
    </div>
    <div class="tray" aria-hidden="true"></div>
  </div>

  <aside class="panel">
    <header>
      <p id="stepLabel">Step 1 of 16</p>
      <h1 id="stepTitle"></h1>
      <div class="progress"><span id="bar"></span></div>
    </header>
    <div class="script" id="script" aria-live="polite"></div>
    <div class="controls">
      <button id="prev">Back</button>
      <button id="replay" title="Redraw this step">Redraw</button>
      <button id="next">Next step</button>
    </div>
  </aside>
</div>

<script>
const steps=[
 {t:"Open with a question",
  draw:"Top left of the board, write <b>How does the DB find Sam?</b> and underline it. Under it, write the query.",
  lines:[
   ["you","Okay, quick question for everyone. Say we've got a customers table with a million people in it, and we want to find Sam by his email. That's this query here."],
   ["you","How do you think the database actually finds him?"],
   ["class","It just searches for it?"],
   ["you","Right, but searches how? Let's draw what's really going on."]]},
 {t:"Draw the table",
  draw:"Under the query, draw a tall rectangle. Label it <b>customers</b>, add a line under the header, then a stack of rows with random emails. Put Sam somewhere in the middle. Write <b>1,000,000 rows (not sorted)</b> underneath.",
  lines:[
   ["you","So here's our table. Every row is one customer."],
   ["you","Notice the emails aren't in any order. They're just stored in whatever order people signed up. Sam is in here somewhere, but the database has no idea where."]]},
 {t:"The full table scan",
  draw:"Switch to the <b>red</b> marker. Draw a long arrow straight down the right side of the table. Under the table write <b>full table scan</b> and <b>= up to 1,000,000 checks</b>.",
  lines:[
   ["you","With nothing else to go on, it starts at the top. Row one, is this Sam? No. Row two? No. And it just keeps going, all the way down."],
   ["you","That's called a full table scan. So how many rows could it end up checking?"],
   ["class","All of them. A million."],
   ["you","Exactly. And unless it knows emails are unique, it can't even stop when it finds Sam. It has to keep going in case there's another one. Fine for 50 rows, really slow for 50 million."]]},
 {t:"The textbook analogy",
  draw:"Bottom left, sketch a small box labelled <b>Index</b> with three entries like a textbook index. In <b>green</b>, circle <b>TCP ... 212</b> and draw an arrow to a little page labelled <b>p. 212</b>.",
  lines:[
   ["you","Let's think about something you already do. If I gave you a 600 page networking textbook and said find 'TCP handshake', would you read every page?"],
   ["class","No, I'd use the index at the back."],
   ["you","Right. It's sorted alphabetically, you find the word fast, and it tells you the page number. Then you jump straight there."],
   ["you","A database index is literally that. A sorted list of values, and each value points to where the full row lives. Let's see what that sorted list looks like inside the database."]]},
 {t:"Start the B-tree",
  draw:"Move to the middle of the board. In <b>blue</b>, write <b>B-tree</b> on the left, then draw one box near the top with <b>50</b> in it.",
  lines:[
   ["you","Most databases store an index as a tree called a B-tree. We'll use small numbers so it's easy to follow, but imagine these are emails in alphabetical order."],
   ["you","At the very top is the root. Ours just holds the number 50."]]},
 {t:"Add the middle level",
  draw:"Draw two lines down from the root. On the left, a box with <b>20 | 35</b>. On the right, a box with <b>70 | 85</b>. Write <b>smaller</b> by the left branch and <b>bigger</b> by the right.",
  lines:[
   ["you","Under the root, we split. Everything smaller than 50 goes left, everything bigger goes right."],
   ["you","Then each of those nodes splits again. The left one has 20 and 35, the right one has 70 and 85. Those numbers are like signposts telling you which way to go."]]},
 {t:"Draw the leaves",
  draw:"Draw three lines down from each middle box and a row of six small boxes along the bottom: <b>5, 12</b> / <b>22, 28</b> / <b>38, 42</b> / <b>55, 60</b> / <b>72, 78</b> / <b>88, 93</b>. Label them underneath.",
  lines:[
   ["you","At the bottom are the leaves. These hold the actual values, and if you read them left to right, they're all in sorted order."],
   ["you","Also notice every leaf is the same distance from the top. That's the 'balanced' part of a B-tree. No matter what you look for, it takes the same number of steps."]]},
 {t:"Search: start at the root",
  draw:"Switch to <b>green</b>. Write <b>find 78</b> above the tree. Circle the root, write <b>78 &gt; 50, go right</b>, and trace over the right branch.",
  lines:[
   ["you","Okay, let's actually search for something. We want 78."],
   ["you","Start at the top. Is 78 less than 50?"],
   ["class","No."],
   ["you","So we go right. And think about what just happened: we completely ignored the whole left half of the data. We'll never look at it."]]},
 {t:"Search: middle level",
  draw:"Circle the <b>70 | 85</b> box. Next to it write <b>70 &lt; 78 &lt; 85, take the middle</b> and trace down the middle branch.",
  lines:[
   ["you","Now we're at 70 and 85. Where does 78 fit?"],
   ["class","In between them."],
   ["you","Yep, so we take the middle branch. Again, we just threw away everything to the left and right."]]},
 {t:"Found it",
  draw:"Circle the <b>72, 78</b> leaf. Underneath it, write <b>found it! 3 steps</b> big.",
  lines:[
   ["you","And there it is, 78, in this leaf."],
   ["you","Count how many places we looked. One, two, three. Three steps. Now look back at that red arrow on the left. That was a million."]]},
 {t:"The pointer back to the row",
  draw:"Draw a dashed <b>green</b> curve from the found leaf all the way back to Sam's row in the table, with an arrowhead. Label it <b>pointer to the real row</b> and box Sam's row.",
  lines:[
   ["you","One important detail: the leaf doesn't store the whole customer row. It stores the value plus a pointer, basically an address."],
   ["you","So the database follows that pointer and jumps directly to Sam's row in the table. No scanning at all."]]},
 {t:"Why it scales",
  draw:"Below the tree, draw a small table with columns <b>rows</b>, <b>scan</b> (red) and <b>index</b> (green). Fill in 1,000 / 1,000,000 / 1 billion. Then write <b>O(n) vs O(log n)</b>.",
  lines:[
   ["you","Here's why this is such a big deal. With a thousand rows, a scan is a thousand checks. The index is about ten."],
   ["you","A million rows? A million checks versus about twenty. A billion? About thirty."],
   ["you","Every time the data gets a thousand times bigger, the tree only needs about ten more steps. If you want the formal names, that's O(n) versus O(log n)."],
   ["class","So why not just index every column?"],
   ["you","Great question. Let's talk about the catch."]]},
 {t:"The trade-off",
  draw:"Right side of the board, write <b>The catch</b>. Draw a triangle with a tilted line on top like a seesaw. High end: <b>reads faster</b> in green. Low end: <b>writes slower + more disk</b> in red.",
  lines:[
   ["you","The index is a separate, sorted copy of that column. And it has to stay in sync with the table."],
   ["you","So every time you insert a new customer, update an email, or delete someone, the database also has to update the index. More indexes means more work on every write."],
   ["you","Plus each index takes up disk space. So reads get faster, but writes get a bit slower. It's a trade-off, not free speed."]]},
 {t:"Rules of thumb",
  draw:"Under the seesaw, write <b>Index it</b> in green with two ticks, then <b>Skip it</b> in red with two crosses.",
  lines:[
   ["you","So how do you decide? Index the columns you search, join, or sort on a lot. Things like email, username, or a foreign key like customer_id. Especially on big tables."],
   ["you","Skip it on tiny tables, because scanning 20 rows is already instant. And skip columns with only a couple of values, like true or false. If half the table is 'true', the index barely narrows anything down."]]},
 {t:"Bonus: composite indexes",
  draw:"Bottom right, write <b>INDEX (last, first)</b> in blue and list five names sorted like a phone book. Bracket the two Singhs in green (<b>together ✓</b>), mark the two Priyas in red (<b>scattered ✗</b>).",
  lines:[
   ["you","One more thing if we have time. You can index two columns together, like last name then first name."],
   ["you","It's sorted exactly like a phone book. So if I ask you for everyone with the last name Singh, easy, they're all right next to each other."],
   ["you","But what if I ask for everyone named Priya?"],
   ["class","They're all over the place."],
   ["you","Exactly. So a composite index only helps when you filter by the leftmost column first. Order matters when you create it."]]},
 {t:"Wrap up",
  draw:"Box a tip at the bottom middle: <b>tip: put EXPLAIN before a query to check</b>. Then step back and point across the board from left to right as you summarize.",
  lines:[
   ["you","So let's put it all together. Over here, without an index, the database reads everything. That's the red arrow."],
   ["you","In the middle, with an index, it walks a sorted tree in just a few steps and follows a pointer straight to the row."],
   ["you","And over here, the cost: slower writes and extra space. So you index the columns you actually search on, not everything."],
   ["you","Last tip: if you ever want to check whether your query is using an index, put EXPLAIN in front of it and the database will tell you its plan. Any questions?"]]}
];

const wb=document.getElementById('wb');
const groups=[...wb.querySelectorAll('g[data-step]')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
groups.forEach(g=>[...g.children].forEach(el=>{
  if(el.tagName!=='text'){el.classList.add('ink');el.setAttribute('pathLength','1')}
}));
let cur=0;

function animate(g){
  [...g.children].forEach((el,i)=>{
    el.classList.remove('anim');
    void el.getBoundingClientRect();
    el.style.setProperty('--d',(i*0.16)+'s');
    if(!reduce)el.classList.add('anim');
  });
}
function settle(g){[...g.children].forEach(el=>el.classList.remove('anim'))}

function render(n,anim){
  groups.forEach((g,i)=>{
    g.classList.toggle('on',i<=n);
    g.classList.toggle('now',i===n);
    if(i<n)settle(g);
  });
  if(anim)animate(groups[n]);else settle(groups[n]);
  const s=steps[n];
  document.getElementById('stepLabel').textContent='Step '+(n+1)+' of '+steps.length;
  document.getElementById('stepTitle').textContent=s.t;
  document.getElementById('bar').style.width=((n+1)/steps.length*100)+'%';
  const box=document.getElementById('script');
  box.innerHTML='<div class="draw"><b>Draw:</b> '+s.draw+'</div>'+
    s.lines.map(([w,txt])=>'<div class="line '+w+'"><span class="who '+w+'">'+(w==='you'?'You':'Class')+'</span><span class="said">'+txt+'</span></div>').join('');
  box.scrollTop=0;
  document.getElementById('prev').disabled=n===0;
  const nx=document.getElementById('next');
  nx.disabled=n===steps.length-1;
  nx.textContent=n===steps.length-1?'Done':'Next step';
  cur=n;
}
document.getElementById('next').onclick=()=>{if(cur<steps.length-1)render(cur+1,true)};
document.getElementById('prev').onclick=()=>{if(cur>0)render(cur-1,false)};
document.getElementById('replay').onclick=()=>animate(groups[cur]);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();document.getElementById('next').click()}
  if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('prev').click()}
});
render(0,true);
</script>
